<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">InsightLens AI — Think Beyond the Scroll</title>
  <desc id="description">An original violet and charcoal editorial banner with the InsightLens aperture, an unverified claim card, and a reflection question.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15161e"/>
      <stop offset="1" stop-color="#1e1b30"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="44%" r="60%">
      <stop offset="0" stop-color="#7b62cb" stop-opacity=".2"/>
      <stop offset="1" stop-color="#7b62cb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a99cde" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a99cde" stop-opacity=".08"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#background)"/>
  <rect width="1280" height="420" rx="20" fill="url(#glow)"/>
  <g fill="none" stroke="#b6a8ed" stroke-opacity=".09">
    <circle cx="1030" cy="210" r="183"/>
    <circle cx="1030" cy="210" r="236"/>
    <circle cx="1030" cy="210" r="288"/>
  </g>
  <g transform="translate(62 42)" fill="none" stroke="#c7b8ff" stroke-width="2.1" stroke-linejoin="round">
    <path d="M20 3 34.7 11.5V28.5L20 37 5.3 28.5V11.5L20 3Z"/>
    <path d="m20 3 8 17-8 17M5.3 11.5 24 13l10.7 15.5M5.3 28.5 16 13l18.7-1.5"/>
    <path d="m16 13 8 0 4 7-4 7h-8l-4-7 4-7Z" fill="#c7b8ff"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="112" y="69" fill="#f6f3ff" font-size="24" font-weight="600" letter-spacing="-.8">InsightLens<tspan dx="7" fill="#c7b8ff" font-size="12" letter-spacing="1">AI</tspan></text>
    <text x="64" y="118" fill="#afa6c5" font-size="10" letter-spacing="3.1">YOUR PERSONAL THINKING SPACE</text>
    <text x="60" y="196" fill="#f5f2fa" font-size="64" font-weight="500" letter-spacing="-2.8">Think beyond</text>
    <text x="62" y="267" fill="#c9baff" font-family="Georgia, Times New Roman, serif" font-size="70" font-style="italic" letter-spacing="-2.6">the scroll.</text>
    <text x="65" y="310" fill="#b4adbf" font-size="15">Understand the argument. Question the claims. Make it yours.</text>
    <g transform="translate(770 55) rotate(-3 205 97)">
      <rect x="5" y="8" width="392" height="183" rx="12" fill="#090a10" opacity=".28"/>
      <rect width="392" height="183" rx="12" fill="#f8f7f4"/>
      <circle cx="25" cy="27" r="4" fill="#7861cc"/>
      <text x="38" y="31" fill="#635a73" font-size="9" letter-spacing="1.9" font-weight="600">CLAIM COMPASS</text>
      <rect x="234" y="17" width="139" height="23" rx="5" fill="#f1e7d2"/>
      <text x="303.5" y="32" fill="#77541e" font-size="8" text-anchor="middle">Not independently verified</text>
      <text x="23" y="81" fill="#26232f" font-family="Georgia, Times New Roman, serif" font-size="25">What would make</text>
      <text x="23" y="112" fill="#26232f" font-family="Georgia, Times New Roman, serif" font-size="25">this claim convincing?</text>
      <path d="M23 136H369" stroke="#e3dfd8"/>
      <text x="23" y="159" fill="#71687c" font-size="10">Look at the reasoning. Notice what is missing.</text>
      <path d="m354 153 8 0m-4-4 4 4-4 4" fill="none" stroke="#7861cc" stroke-width="1.5"/>
    </g>
    <g transform="translate(827 251) rotate(3 162 46)">
      <rect x="3" y="6" width="330" height="93" rx="10" fill="#090a10" opacity=".2"/>
      <rect width="330" height="93" rx="10" fill="#d7ccff"/>
      <text x="20" y="25" fill="#5c468f" font-size="8" letter-spacing="1.7" font-weight="600">REFLECTION LOOP · 01 / 03</text>
      <text x="20" y="58" fill="#352a4e" font-family="Georgia, Times New Roman, serif" font-size="20">Explain it in your own words.</text>
      <circle cx="22" cy="77" r="2" fill="#6b53ac"/>
      <circle cx="30" cy="77" r="2" fill="#a28bcf"/>
      <circle cx="38" cy="77" r="2" fill="#a28bcf"/>
    </g>
    <path d="M65 358H1215" stroke="url(#rule)"/>
    <circle cx="70" cy="386" r="3" fill="#bba9f0"/>
    <text x="84" y="390" fill="#c4b9da" font-size="9" letter-spacing="2">UNDERSTAND</text>
    <text x="215" y="390" fill="#716781" font-size="10">/</text>
    <text x="242" y="390" fill="#c4b9da" font-size="9" letter-spacing="2">QUESTION</text>
    <text x="361" y="390" fill="#716781" font-size="10">/</text>
    <text x="389" y="390" fill="#c4b9da" font-size="9" letter-spacing="2">REMEMBER</text>
    <text x="1213" y="390" fill="#8d819f" font-size="9" letter-spacing="1.5" text-anchor="end">AI ASSISTS. YOU DECIDE.</text>
  </g>
  <path d="M718 123v12m-6-6h12M1210 279v8m-4-4h8" fill="none" stroke="#baa4ed" stroke-opacity=".6" stroke-width="1.4"/>
</svg>
